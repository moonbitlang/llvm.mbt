name: check

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    name: native / ${{ matrix.runner.name }} / ${{ matrix.version }}
    strategy:
      matrix:
        runner:
          - name: Linux x86_64
            os: ubuntu-22.04
          - name: macOS ARM64
            os: macos-15
        version: [latest, nightly]
      fail-fast: false
    runs-on: ${{ matrix.runner.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner architecture
        shell: bash
        run: |
          case "${{ matrix.runner.name }}:$(uname -s):$(uname -m)" in
            "Linux x86_64:Linux:x86_64"|"macOS ARM64:Darwin:arm64") ;;
            *) echo "Unexpected runner architecture: $(uname -s) $(uname -m)" >&2; exit 1 ;;
          esac

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "${{ matrix.version }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        shell: bash
        run: |
          moon version --all
          moonrun --version
          node --version

      - name: Update module dependencies
        shell: bash
        run: moon update

      # runner 是一次性的，所以这里主动清空 llvm.mbt 自己的缓存。第一次调用
      # 必须走 Release 下载，第二次调用必须命中共享缓存；两个输出还应完全一致。
      - name: Verify LLVM download and shared cache
        shell: bash
        run: |
          moon_home="${MOON_HOME:-$HOME/.moon}"
          rm -rf "$moon_home/cache/lib/llvm.mbt"
          node ./build.js </dev/null > "$RUNNER_TEMP/llvm-cold.json" 2> "$RUNNER_TEMP/llvm-cold.log"
          node ./build.js </dev/null > "$RUNNER_TEMP/llvm-hot.json" 2> "$RUNNER_TEMP/llvm-hot.log"
          cat "$RUNNER_TEMP/llvm-cold.log"
          cat "$RUNNER_TEMP/llvm-hot.log"
          grep -F "LLVM 共享缓存校验通过" "$RUNNER_TEMP/llvm-hot.log"
          cmp "$RUNNER_TEMP/llvm-cold.json" "$RUNNER_TEMP/llvm-hot.json"

      - name: Moon check
        run: moon check --target native

      - name: Moon test
        shell: bash
        run: |
          ulimit -s 8176
          moon test --target native --release

  moon-json-format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check moon.*.json format
        shell: bash
        run: |
          passed=0
          while IFS= read -r -d '' file; do
            if ! jq '.' "$file" > /dev/null; then
              echo "$file"
              passed=1
            fi
          done < <(find . -type f -name 'moon.*.json' -print0)
          exit "$passed"

  typo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Spell check repository
        uses: crate-ci/typos@v1.19.0
